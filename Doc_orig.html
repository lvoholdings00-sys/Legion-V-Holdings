<!DOCTYPE html>
<html lang="en">
<head>
<script>
// ── Auth gate: runs immediately before any rendering ──
(function() {
  var LOGIN = 'https://lvo-cloud.cloud';
  var MAX_WAIT_MS = 3000;
  var POLL_MS     = 150;
  var waited      = 0;

  // How long before expiry to show the "still there?" banner. Your
  // original session is only 150 seconds (SESSION_MS in LVO-Directory's
  // login page), so a long lead time would show the banner immediately —
  // 45s gives people a real window to click "Stay signed in" before the
  // kick fires.
  var WARN_BEFORE_MS = 45 * 1000;
  var TICK_MS = 1000;

  // How long to extend the session by on a successful refresh. This is
  // decided entirely client-side (lvo_expiry is just a clock the browser
  // trusts, not something Supabase enforces) — 30 minutes is far more
  // livable for actually working in the document library than the
  // original 150s login window, while the real security boundary (the
  // TOTP code + shared Supabase login) is unchanged.
  var REFRESH_SESSION_MS = 30 * 60 * 1000;

  // Real endpoint: the /api/refresh route added alongside /api/login in
  // the LVO-Setup project (same Vercel deployment as lvo-setup.vercel.app).
  // Cookies live on .lvo-cloud.cloud, NOT vercel.app, so the browser won't
  // auto-attach them cross-domain — instead we read sb_refresh_token
  // ourselves (readable here since docu.lvo-cloud.cloud shares the parent
  // domain) and send it explicitly in the request body.
  var SESSION_REFRESH_URL = 'https://lvo-setup.vercel.app/api/refresh';

  var warnTimer = null, kickTimer = null, tickTimer = null, bannerEl = null;


  function getCookie(name) {
    var match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return match ? decodeURIComponent(match[1]) : null;
  }

  function clearAuthCookies() {
    document.cookie = 'lvo_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.lvo-cloud.cloud; path=/';
    document.cookie = 'lvo_expiry=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=.lvo-cloud.cloud; path=/';
  }

  function kick() {
    clearAuthCookies();
    window.location.replace(LOGIN);
  }

  function clearTimers() {
    if (warnTimer) clearTimeout(warnTimer);
    if (kickTimer) clearTimeout(kickTimer);
    if (tickTimer) clearInterval(tickTimer);
    warnTimer = kickTimer = tickTimer = null;
  }

  function fmtMMSS(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60); s = s % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function removeBanner() {
    if (bannerEl && bannerEl.parentNode) bannerEl.parentNode.removeChild(bannerEl);
    bannerEl = null;
    if (document.body) document.body.style.paddingTop = '';
  }

  function showWarningBanner(expiry) {
    if (document.getElementById('session-warning-banner')) return;
    var bar = document.createElement('div');
    bar.id = 'session-warning-banner';
    bar.setAttribute('style',
      'position:fixed;top:0;left:0;right:0;z-index:999;' +
      'background:#161410;border-bottom:1px solid #8a7238;color:#eae7e0;' +
      'font-family:"IBM Plex Mono",monospace;font-size:12.5px;' +
      'padding:10px 18px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;');

    var label = document.createElement('span');
    bar.appendChild(label);

    var btn = document.createElement('button');
    btn.textContent = 'Stay signed in';
    btn.setAttribute('style',
      'font-family:inherit;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;' +
      'background:#C8A96E;color:#0a0a0c;border:none;padding:7px 14px;cursor:pointer;border-radius:2px;');
    btn.onclick = function () { requestMoreTime(btn, label); };
    bar.appendChild(btn);

    var closeBtn = document.createElement('span');
    closeBtn.textContent = '\u2715';
    closeBtn.setAttribute('style', 'cursor:pointer;color:#8b8a86;padding:0 4px;');
    closeBtn.onclick = function () { removeBanner(); };
    bar.appendChild(closeBtn);

    document.body.appendChild(bar);
    bannerEl = bar;
    document.body.style.paddingTop = bar.offsetHeight + 'px';

    function tick() {
      var remaining = expiry - Date.now();
      label.textContent = 'Your session expires in ' + fmtMMSS(remaining) + ' \u2014 ';
      if (remaining <= 0) clearInterval(tickTimer);
    }
    tick();
    tickTimer = setInterval(tick, TICK_MS);
  }

  function setSessionCookies(data, expiry) {
    var expiryUTC = new Date(expiry).toUTCString();
    document.cookie = 'lvo_token=' + data.token + '; expires=' + expiryUTC + '; domain=.lvo-cloud.cloud; path=/; SameSite=Lax';
    document.cookie = 'lvo_expiry=' + expiry + '; expires=' + expiryUTC + '; domain=.lvo-cloud.cloud; path=/; SameSite=Lax';
    if (data.sb_access_token && data.sb_refresh_token) {
      document.cookie = 'sb_access_token=' + data.sb_access_token + '; expires=' + expiryUTC + '; domain=.lvo-cloud.cloud; path=/; SameSite=Lax';
      document.cookie = 'sb_refresh_token=' + data.sb_refresh_token + '; expires=' + expiryUTC + '; domain=.lvo-cloud.cloud; path=/; SameSite=Lax';
    }
  }

  function requestMoreTime(btn, label) {
    var refreshToken = getCookie('sb_refresh_token');
    if (!refreshToken) {
      label.textContent = 'No refresh token found \u2014 please log in again. ';
      return;
    }
    btn.disabled = true;
    var original = btn.textContent;
    btn.textContent = 'Requesting\u2026';
    fetch(SESSION_REFRESH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken })
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ('server said ' + res.status));
          return data;
        });
      })
      .then(function (data) {
        var newExpiry = Date.now() + REFRESH_SESSION_MS;
        setSessionCookies(data, newExpiry);
        clearTimers();
        removeBanner();
        scheduleFromExpiry(newExpiry);
      })
      .catch(function (e) {
        btn.disabled = false;
        btn.textContent = original;
        label.textContent = 'Could not extend your session (' + e.message + '). ';
      });
  }

  function scheduleFromExpiry(expiry) {
    var remaining = expiry - Date.now();
    if (remaining <= 0) { kick(); return; }

    kickTimer = setTimeout(kick, remaining);

    var warnIn = remaining - WARN_BEFORE_MS;
    var doShow = function () { showWarningBanner(expiry); };
    if (warnIn <= 0) {
      if (document.body) doShow(); else document.addEventListener('DOMContentLoaded', doShow);
    } else {
      warnTimer = setTimeout(function () {
        if (document.body) doShow(); else document.addEventListener('DOMContentLoaded', doShow);
      }, warnIn);
    }
  }

  function check() {
    var token  = getCookie('lvo_token');
    var expiry = parseInt(getCookie('lvo_expiry') || '0', 10);
    var valid  = token && expiry && Date.now() < expiry;

    if (valid) {
      scheduleFromExpiry(expiry);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          var exp = parseInt(getCookie('lvo_expiry') || '0', 10);
          if (!exp || Date.now() >= exp) {
            kick();
          } else {
            // Cookie may have been refreshed in another tab — resync.
            clearTimers();
            removeBanner();
            scheduleFromExpiry(exp);
          }
        }
      });
      return;
    }
    waited += POLL_MS;
    if (waited >= MAX_WAIT_MS) { kick(); } else { setTimeout(check, POLL_MS); }
  }
  check();
})();
</script>

<style>
  :root{
    --bg:#0a0a0c; --bg-raised:#111114; --bg-sunken:#0d0d10; --line:#242327; --line-soft:#1a1a1d;

  .back-menu .arrow{font-size:12px;line-height:0;}

  .brand-seal{width:34px;height:34px;border:1px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:16px;color:var(--brass);margin-bottom:14px;flex-shrink:0;}
  .brand h1{font-size:22px;letter-spacing:-.01em;color:var(--ink);}
  .brand .eyebrow{margin-top:4px;}
  .side-divider{height:1px;background:var(--line);margin:24px 0 18px;}
  .side-links{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;}
  .side-link{padding:9px 10px;border-radius:var(--radius);font-size:14px;color:var(--ink-dim);display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;border:1px solid transparent;transition:background .12s,color .12s,border-color .12s;}

  .side-link .count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);}
  .new-folder-link{margin-top:6px;font-size:12.5px;color:var(--brass);cursor:pointer;padding:9px 10px;}
  .new-folder-link:hover{color:var(--ink);}
  .sidebar-footer{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);}
  .sidebar-footer .who{font-size:13px;color:var(--ink-dim);margin-bottom:6px;}
  .storage-bar-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;}

  .main{flex:1;padding:52px 56px;min-width:0;}
  .main-narrow{max-width:1320px;}
  .division-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:16px;}
  .head-actions{display:flex;gap:10px;}
  .card{background:var(--bg-raised);border:1px solid var(--line);padding:22px 24px;position:relative;}
  .field-label{display:block;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px;}
  input[type=text],input[type=email],input[type=number],input[type=date],input[type=file],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:11px 13px;font-size:14px;border-radius:var(--radius);}
  textarea{min-height:80px;resize:vertical;font-family:inherit;}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brass-dim);}
  select{appearance:none;-webkit-appearance:none;cursor:pointer;}
  .btn{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--btn-text);border:none;padding:12px 20px;cursor:pointer;transition:background .15s,opacity .15s;white-space:nowrap;}
  .btn:hover{background:var(--brass);color:var(--btn-text);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--brass-dim);background:transparent;}
  .btn-sm{padding:8px 14px;font-size:11px;}
  .form-hint{color:var(--ink-faint);font-size:12.5px;margin-top:12px;line-height:1.6;}
  .form-err{color:var(--red);font-size:12.5px;margin-top:12px;line-height:1.6;}
  .empty-row{color:var(--ink-faint);font-size:14px;padding:40px 0;text-align:center;}

  /* ---------- Search bar & layout ---------- */
  .search-shell{display:flex;gap:24px;align-items:flex-start;}
  .search-main{flex:1;min-width:0;}
  .search-bar-row{display:flex;gap:10px;margin-bottom:16px;}
  .search-bar-row .search-input-wrap{position:relative;flex:1;}
  .search-bar-row input[type=text]{padding-left:38px;font-size:14.5px;}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:13px;pointer-events:none;}
  .sort-select{max-width:190px;}
  .active-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-chip{display:inline-flex;align-items:center;gap:7px;background:var(--bg-raised);border:1px solid var(--brass-dim);color:var(--ink);font-size:12px;font-family:'IBM Plex Mono',monospace;padding:5px 10px;border-radius:var(--radius);}
  .filter-chip .x{cursor:pointer;color:var(--ink-faint);}
  .filter-chip .x:hover{color:var(--red);}
  .clear-all-link{font-size:12px;color:var(--ink-faint);cursor:pointer;align-self:center;}
  .clear-all-link:hover{color:var(--red);}
  .result-count-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;color:var(--ink-dim);font-size:13px;}

  /* ---------- Facet / filter sidebar ---------- */
  .filter-panel{width:240px;flex-shrink:0;background:var(--bg-raised);border:1px solid var(--line);padding:20px;}
  .filter-group{margin-bottom:22px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-group-title{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .facet-list{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto;}
  .facet-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-dim);padding:5px 4px;border-radius:var(--radius);cursor:pointer;}
  .facet-row:hover{background:var(--bg-sunken);color:var(--ink);}
  .facet-row.checked{color:var(--brass);}
  .facet-row .facet-name{display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .facet-row .facet-count{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint);flex-shrink:0;}
  .checkbox-fake{width:13px;height:13px;border:1px solid var(--line);flex-shrink:0;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;}
  .facet-row.checked .checkbox-fake{border-color:var(--brass);background:var(--brass);color:#000;}
  .range-inputs{display:flex;gap:8px;align-items:center;}
  .range-inputs input{padding:8px 10px;font-size:12.5px;}
  .range-inputs span{color:var(--ink-faint);font-size:12px;}
  .apply-range-btn{margin-top:8px;width:100%;}
  .tag-input-row{display:flex;gap:6px;}
  .tag-pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg-sunken);border:1px solid var(--line);font-size:11.5px;padding:4px 8px;border-radius:12px;margin:3px 4px 0 0;}
  .tag-pill .x{cursor:pointer;color:var(--ink-faint);}

  .file-table{width:100%;border-collapse:collapse;}
  .file-table th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);font-weight:400;padding:0 0 12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  .file-table th:hover{color:var(--ink);}
  .file-table th.sorted{color:var(--brass);}
  .file-table td{padding:14px 0;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle;}
  .file-table tr:last-child td{border-bottom:none;}
  .file-name{font-weight:500;display:flex;align-items:center;gap:10px;}
  .file-icon{width:26px;height:26px;flex-shrink:0;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--brass);font-family:'IBM Plex Mono',monospace;}
  .file-meta{color:var(--ink-dim);font-size:12.5px;}
  .file-sub-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .file-sub-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint);border:1px solid var(--line);padding:1px 6px;border-radius:8px;}
  mark{background:var(--brass-dim);color:#000;padding:0 1px;border-radius:1px;}
  .row-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
  .icon-btn{background:none;border:1px solid var(--line);color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 11px;cursor:pointer;border-radius:var(--radius);}
  .icon-btn:hover{color:var(--ink);border-color:var(--brass-dim);}
  .icon-btn.danger:hover{color:var(--red);border-color:var(--red);}
  .drop-zone{border:1px dashed var(--line);padding:32px 24px;text-align:center;color:var(--ink-dim);font-size:13.5px;cursor:pointer;transition:border-color .15s,color .15s;margin-bottom:18px;}
  .drop-zone:hover,.drop-zone.drag{border-color:var(--brass-dim);color:var(--ink);}
  .pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px;color:var(--ink-dim);font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--bg-raised);border:1px solid var(--line);padding:28px;width:100%;max-width:440px;}
  .modal.modal-wide{max-width:820px;}
  .modal .form-title{margin-bottom:20px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
  .preview-body{max-height:70vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);margin-bottom:10px;}
  .preview-body img{max-width:100%;max-height:70vh;display:block;}
  .preview-body video{max-width:100%;max-height:70vh;display:block;}
  .preview-body audio{width:100%;margin:30px 20px;}
  .preview-body iframe{width:100%;height:70vh;border:none;}
  .preview-body pre{width:100%;max-height:70vh;overflow:auto;margin:0;padding:20px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
  .preview-unsupported{padding:60px 20px;text-align:center;color:var(--ink-dim);font-size:13.5px;line-height:1.7;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--brass-dim);color:var(--brass);padding:5px 10px;}
  .loading{padding:80px;color:var(--ink-dim);font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:center;}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg-raised);border:1px solid var(--brass-dim);color:var(--ink);padding:12px 18px;font-size:13px;border-radius:var(--radius);z-index:60;max-width:340px;}
  .toast.err{border-color:var(--red);}
  @media (max-width:1050px){
    .search-shell{flex-direction:column;} .filter-panel{width:100%;order:2;}
  }
  @media (max-width:900px){
    #app{flex-direction:column;} .sidebar{width:100%;height:auto;position:relative;} .main{padding:28px 20px;}
    .file-table thead{display:none;} .file-table tr{display:flex;flex-wrap:wrap;padding:14px 0;} .file-table td{border:none;padding:4px 0;width:100%;}
    .row-actions{justify-content:flex-start;}
  }
</style>

    sortBy: 'date', sortOrder: 'desc',
    stats: null,
    modal: null,
    dragging: false,
    loadingResults: false,
    searchDebounce: null
  };

  /* ---------------- API helper ---------------- */
  function api(path, opts){
    opts = opts || {};
    var headers = opts.headers || {};
    if(cfg.apiToken) headers['Authorization'] = 'Bearer ' + cfg.apiToken;
    if(opts.json !== undefined){
      headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.json);
    }
    return fetch(cfg.apiBase + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body
    }).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return {error:'Request failed ('+res.status+')'}; })
          .then(function(d){ throw new Error(d.error || 'Request failed ('+res.status+')'); });
      }
      return res.status === 204 ? null : res.json();
    });
  }

  function uidLocal(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }
  function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
  function extOf(name){ var m = /\.([a-zA-Z0-9]+)$/.exec(name); return m ? m[1].toUpperCase() : 'FILE'; }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function highlight(text, q){
    if(!q) return escapeHtml(text);
    var terms = q.trim().split(/\s+/).filter(Boolean).map(function(t){ return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
    if(!terms.length) return escapeHtml(text);
    var re = new RegExp('(' + terms.join('|') + ')', 'ig');
    return escapeHtml(text).replace(re, '<mark>$1</mark>');
  }
  function toast(msg, isErr){
    var t = el('div', {class:'toast' + (isErr?' err':'')}, [msg]);
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3800);
  }

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='class') e.className = attrs[k];
      else if(k==='html') e.innerHTML = attrs[k];
      else if(k.indexOf('on')===0) e.addEventListener(k.slice(2), attrs[k]);
      else if(attrs[k]!==null && attrs[k]!==undefined) e.setAttribute(k, attrs[k]);
    });
    (children||[]).forEach(function(c){
      if(c===null||c===undefined) return;
      if(typeof c==='string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }

  function folderName(id){
    if(id==='all') return 'All Documents';
    if(id==='root'||!id) return 'Unfiled';
    var f = state.folders.filter(function(x){ return x.id===id; })[0];
    return f ? f.name : 'Unknown';
  }

  /* ---------------- Data loading ---------------- */
  async function loadFolders(){
    var data = await api('/api/folders');
    state.folders = data.folders;
  }
  async function loadStats(){
    state.stats = await api('/api/stats');
  }

  function buildSearchQuery(extraPage){
    var p = new URLSearchParams();
    if(state.q.trim()) p.set('q', state.q.trim());
    if(state.activeFolder !== 'all') p.set('folderId', state.activeFolder);
    if(state.filters.types.length) p.set('type', state.filters.types.join(','));
    if(state.filters.tags.length) p.set('tags', state.filters.tags.join(','));
    if(state.filters.dateFrom) p.set('dateFrom', state.filters.dateFrom);
    if(state.filters.dateTo) p.set('dateTo', state.filters.dateTo);
    if(state.filters.sizeMin) p.set('sizeMin', String(Number(state.filters.sizeMin) * 1024 * 1024));
    if(state.filters.sizeMax) p.set('sizeMax', String(Number(state.filters.sizeMax) * 1024 * 1024));
    p.set('sortBy', state.sortBy);
    p.set('sortOrder', state.sortOrder);
    p.set('page', String(extraPage || state.page));
    p.set('pageSize', String(state.pageSize));
    p.set('facets', 'true');
    return p.toString();
  }

  async function runSearch(){
    state.loadingResults = true; render();
    try{
      var data = await api('/api/search?' + buildSearchQuery());
      state.files = data.results;
      state.total = data.total;
      state.totalPages = data.totalPages;
      state.facets = data.facets || {extensions:[], folders:[]};
    }catch(e){
      toast(e.message, true);
    }
    state.loadingResults = false;
    render();
  }

  function debounceSearch(){
    clearTimeout(state.searchDebounce);
    state.searchDebounce = setTimeout(function(){ state.page = 1; runSearch(); }, 280);
  }

  /* ---------------- Actions ---------------- */
  async function handleFiles(fileList){
    var arr = Array.prototype.slice.call(fileList);
    for(var i=0;i<arr.length;i++){
      var f = arr[i];
      var form = new FormData();
      form.append('file', f);
      if(state.activeFolder !== 'all' && state.activeFolder !== 'root') form.append('folderId', state.activeFolder);
      try{
        await api('/api/files', { method:'POST', body: form });
      }catch(e){
        toast('Upload failed for "' + f.name + '": ' + e.message, true);
      }
    }
    await Promise.all([loadFolders(), loadStats(), runSearch()]);
    toast(arr.length + ' file(s) uploaded.');
  }

  async function deleteFile(id){
    if(!confirm('Move this document to trash?')) return;
    try{
      await api('/api/files/' + id, { method:'DELETE' });
      await Promise.all([loadFolders(), loadStats(), runSearch()]);
    }catch(e){ toast(e.message, true); }
  }

  async function createFolder(name){
    await api('/api/folders', { method:'POST', json:{ name: name } });
    await loadFolders();
  }

  async function deleteFolder(id){
    var f = state.folders.filter(function(x){ return x.id===id; })[0];
    var msg = f && f.fileCount ? ('Delete "' + f.name + '"? ' + f.fileCount + ' document(s) inside will move to Unfiled.') : ('Delete "' + folderName(id) + '"?');
    if(!confirm(msg)) return;
    try{
      await api('/api/folders/' + id, { method:'DELETE' });
      if(state.activeFolder === id) state.activeFolder = 'all';
      await Promise.all([loadFolders(), runSearch()]);
    }catch(e){ toast(e.message, true); }
  }

  async function renameFile(id, newName){
    await api('/api/files/' + id, { method:'PATCH', json:{ name: newName } });
    await runSearch();
  }
  async function moveFile(id, folderId){
    await api('/api/files/' + id, { method:'PATCH', json:{ folderId: folderId } });
    await Promise.all([loadFolders(), runSearch()]);
  }
  async function retagFile(id, tags){
    await api('/api/files/' + id, { method:'PATCH', json:{ tags: tags } });
    await runSearch();
  }

  function downloadFile(id, name){
    var url = cfg.apiBase + '/api/files/' + id + '/download';
    fetch(url, { headers: cfg.apiToken ? {Authorization:'Bearer '+cfg.apiToken} : {} })
      .then(function(r){ if(!r.ok) throw new Error('Download failed'); return r.blob(); })
      .then(function(blob){
        var objUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = objUrl; a.download = name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(objUrl); }, 1000);
      })
      .catch(function(e){ toast(e.message, true); });
  }

  var TEXT_EXTS = ['txt','md','csv','json','log','xml','yaml','yml','ini','conf','js','css','html','htm','ts','py','sh'];
  function previewKind(f){
    var ext = (f.extension||'').toLowerCase();
    var type = (f.mimeType || '').toLowerCase();
    if(type.indexOf('image/') === 0) return 'image';
    if(type.indexOf('video/') === 0) return 'video';
    if(type.indexOf('audio/') === 0) return 'audio';
    if(type === 'application/pdf' || ext === 'pdf') return 'pdf';
    if(type.indexOf('text/') === 0 || TEXT_EXTS.indexOf(ext) !== -1) return 'text';
    return 'unsupported';
  }

  /* ---------------- Filter helpers ---------------- */
  function toggleTypeFilter(ext){
    var i = state.filters.types.indexOf(ext);
    if(i===-1) state.filters.types.push(ext); else state.filters.types.splice(i,1);
    state.page = 1; runSearch();
  }
  function toggleFolderFacet(folderId){
    state.activeFolder = folderId || 'root';
    state.page = 1; runSearch();
  }
  function removeFilter(kind, value){
    if(kind==='type') state.filters.types = state.filters.types.filter(function(t){ return t!==value; });
    if(kind==='tag') state.filters.tags = state.filters.tags.filter(function(t){ return t!==value; });
    if(kind==='dateFrom') state.filters.dateFrom = '';
    if(kind==='dateTo') state.filters.dateTo = '';
    if(kind==='sizeMin') state.filters.sizeMin = '';
    if(kind==='sizeMax') state.filters.sizeMax = '';
    if(kind==='q') state.q = '';
    if(kind==='folder') state.activeFolder = 'all';
    state.page = 1; runSearch();
  }
  function clearAllFilters(){
    state.q = '';
    state.filters = { types: [], tags: [], dateFrom: '', dateTo: '', sizeMin: '', sizeMax: '' };
    state.activeFolder = 'all';
    state.page = 1; runSearch();
  }
  function setSort(field){
    if(state.sortBy === field){ state.sortOrder = state.sortOrder === 'asc' ? 'desc' : 'asc'; }
    else { state.sortBy = field; state.sortOrder = field==='name' ? 'asc' : 'desc'; }
    runSearch();
  }

  /* ---------------- Render ---------------- */
  function render(){
    appEl.innerHTML = '';
    var wrap = el('div', {style:'display:flex;width:100%;'});
    wrap.appendChild(renderSidebar());
    wrap.appendChild(renderMain());
    appEl.appendChild(wrap);
    if(state.modal) appEl.appendChild(renderModal());
  }

  function renderSidebar(){
    var side = el('div', {class:'sidebar'});
    side.appendChild(el('div', {class:'back-menu', onclick:function(){ window.location.href = cfg.menuUrl; }}, [
      el('span', {class:'arrow'}, ['\u2190']), el('span', {}, ['Menu'])
    ]));
    side.appendChild(el('div', {class:'brand'}, [
      el('div', {class:'brand-seal'}, ['L']),
      el('h1', {}, ['LVO Holdings']),
      el('div', {class:'eyebrow'}, ['Documents'])
    ]));
    side.appendChild(el('div', {class:'side-divider'}));

    var links = el('div', {class:'side-links'});
    links.appendChild(el('div', {
      class:'side-link' + (state.activeFolder==='all'?' active':''),
      onclick:function(){ state.activeFolder='all'; state.page=1; runSearch(); }
    }, [el('span', {}, ['All Documents']), el('span', {class:'count'}, [state.stats ? String(state.stats.fileCount) : '—'])]));
    links.appendChild(el('div', {
      class:'side-link' + (state.activeFolder==='root'?' active':''),
      onclick:function(){ state.activeFolder='root'; state.page=1; runSearch(); }
    }, [el('span', {}, ['Unfiled'])]));
    state.folders.forEach(function(f){
      links.appendChild(el('div', {
        class:'side-link' + (state.activeFolder===f.id?' active':''),
        onclick:function(){ state.activeFolder=f.id; state.page=1; runSearch(); }
      }, [el('span', {}, [f.name]), el('span', {class:'count'}, [String(f.fileCount)])]));
    });
    side.appendChild(links);
    side.appendChild(el('div', {class:'new-folder-link', onclick:function(){ state.modal={type:'newFolder'}; render(); }}, ['+ New folder']));
    if(state.activeFolder !== 'all' && state.activeFolder !== 'root'){
      side.appendChild(el('div', {class:'new-folder-link', style:'color:var(--red);', onclick:function(){ deleteFolder(state.activeFolder); }}, ['Delete this folder']));
    }

    side.appendChild(el('div', {class:'side-divider'}));
    side.appendChild(el('div', {class:'eyebrow', style:'margin-bottom:10px;'}, ['Other Consoles']));
    var otherLinks = el('div', {class:'side-links'});
    otherLinks.appendChild(el('div', {class:'side-link', onclick:function(){ window.location.href = cfg.dashUrl; }}, ['Command Center']));
    otherLinks.appendChild(el('div', {class:'side-link', onclick:function(){ window.location.href = cfg.chatUrl; }}, ['Chat']));
    side.appendChild(otherLinks);

    var footer = el('div', {class:'sidebar-footer'});
    if(state.stats){
      footer.appendChild(el('div', {class:'who'}, [state.stats.fileCount + ' document' + (state.stats.fileCount===1?'':'s') + ' \u00b7 ' + fmtSize(state.stats.totalBytes)]));
      footer.appendChild(el('div', {class:'storage-bar-track'}, [el('div', {class:'storage-bar-fill', style:'width:' + Math.min(100, state.stats.totalBytes/(50*1024*1024*1024)*100) + '%;'})]));
    }
    footer.appendChild(el('div', {class:'form-hint'}, ['Stored in Cloudflare R2, indexed in D1 \u2014 shared across the whole team.']));
    side.appendChild(footer);
    return side;
  }

  function renderMain(){
    var main = el('div', {class:'main main-narrow'});
    main.appendChild(el('div', {class:'division-head'}, [
      el('div', {}, [
        el('div', {class:'eyebrow'}, ['LIBRARY']),
        el('h3', {}, [folderName(state.activeFolder)])
      ]),
      el('div', {class:'head-actions'}, [
        el('button', {class:'btn btn-ghost', onclick:function(){ state.modal={type:'newFolder'}; render(); }}, ['New Folder']),
        el('button', {class:'btn', onclick:function(){ document.getElementById('fileInput').click(); }}, ['Upload Files'])
      ])
    ]));

    var fileInput = el('input', {type:'file', id:'fileInput', multiple:'multiple', style:'display:none;', onchange:function(e){ handleFiles(e.target.files); e.target.value=''; }});
    main.appendChild(fileInput);

    var dz = el('div', {class:'drop-zone' + (state.dragging?' drag':'')}, [
      el('div', {}, ['Drag & drop files here, or click Upload Files above.'])
    ]);
    dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', function(){ dz.classList.remove('drag'); });
    dz.addEventListener('drop', function(e){ e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
    main.appendChild(dz);

    main.appendChild(renderSearchShell());
    return main;
  }

  function renderSearchShell(){
    var shell = el('div', {class:'search-shell'});
    var searchMain = el('div', {class:'search-main'});

    // search bar + sort
    var barRow = el('div', {class:'search-bar-row'});
    var inputWrap = el('div', {class:'search-input-wrap'});
    var searchI = el('input', {type:'text', placeholder:'Search all folders, titles, tags, notes\u2026', value: state.q});
    searchI.addEventListener('input', function(e){ state.q = e.target.value; debounceSearch(); });
    inputWrap.appendChild(el('span', {class:'search-icon'}, ['\u2315']));
    inputWrap.appendChild(searchI);
    barRow.appendChild(inputWrap);

    var sortSel = el('select', {class:'sort-select'}, [
      el('option', {value:'relevance'}, ['Best match']),
      el('option', {value:'date'}, ['Date added']),
      el('option', {value:'name'}, ['Name']),
      el('option', {value:'size'}, ['File size'])
    ]);
    sortSel.value = state.sortBy;
    sortSel.addEventListener('change', function(e){ state.sortBy = e.target.value; runSearch(); });
    barRow.appendChild(sortSel);
    searchMain.appendChild(barRow);

    // active filter chips
    var chips = [];
    if(state.q) chips.push({label:'"' + state.q + '"', kind:'q'});
    if(state.activeFolder !== 'all') chips.push({label:'Folder: ' + folderName(state.activeFolder), kind:'folder'});
    state.filters.types.forEach(function(t){ chips.push({label:'Type: .' + t, kind:'type', value:t}); });
    state.filters.tags.forEach(function(t){ chips.push({label:'Tag: ' + t, kind:'tag', value:t}); });
    if(state.filters.dateFrom) chips.push({label:'From: ' + state.filters.dateFrom, kind:'dateFrom'});
    if(state.filters.dateTo) chips.push({label:'To: ' + state.filters.dateTo, kind:'dateTo'});
    if(state.filters.sizeMin) chips.push({label:'Min: ' + state.filters.sizeMin + ' MB', kind:'sizeMin'});
    if(state.filters.sizeMax) chips.push({label:'Max: ' + state.filters.sizeMax + ' MB', kind:'sizeMax'});
    if(chips.length){
      var chipRow = el('div', {class:'active-filters'});
      chips.forEach(function(c){
        chipRow.appendChild(el('span', {class:'filter-chip'}, [
          c.label, el('span', {class:'x', onclick:function(){ removeFilter(c.kind, c.value); }}, ['\u2715'])
        ]));
      });
      chipRow.appendChild(el('span', {class:'clear-all-link', onclick:clearAllFilters}, ['Clear all']));
      searchMain.appendChild(chipRow);
    }

    searchMain.appendChild(el('div', {class:'result-count-row'}, [
      el('span', {}, [state.loadingResults ? 'Searching\u2026' : (state.total + ' document' + (state.total===1?'':'s') + ' found')]),
      el('span', {}, [state.total ? ('Page ' + state.page + ' of ' + state.totalPages) : ''])
    ]));

    searchMain.appendChild(renderResultsTable());
    if(state.totalPages > 1) searchMain.appendChild(renderPagination());

    shell.appendChild(searchMain);
    shell.appendChild(renderFilterPanel());
    return shell;
  }

  function renderResultsTable(){
    var panel = el('div', {class:'card'});
    if(!state.files.length){
      panel.appendChild(el('div', {class:'empty-row'}, [state.loadingResults ? 'Loading\u2026' : 'No documents match your search and filters.']));
      return panel;
    }
    function th(label, field){
      var sorted = state.sortBy === field;
      return el('th', {class: sorted ? 'sorted' : '', onclick:function(){ setSort(field); }},
        [label + (sorted ? (state.sortOrder==='asc' ? ' \u2191' : ' \u2193') : '')]);
    }
    var table = el('table', {class:'file-table'});
    table.appendChild(el('thead', {}, [el('tr', {}, [
      th('Name','name'), el('th', {}, ['Folder']), th('Size','size'), th('Added','date'), el('th', {style:'text-align:right;'}, ['Actions'])
    ])]));
    var tbody = el('tbody');
    state.files.forEach(function(f){
      var nameCell = el('div', {class:'file-name', style:'cursor:pointer;', onclick:function(){ state.modal={type:'preview', fileId:f.id}; render(); }}, [
        el('div', {class:'file-icon'}, [(f.extension||'FILE').slice(0,4).toUpperCase()]),
        el('div', {}, [
          el('div', {html: highlight(f.name, state.q)}),
          f.tags && f.tags.length ? el('div', {class:'file-sub-tags'}, f.tags.map(function(t){ return el('span',{class:'file-sub-tag'},[t]); })) : null
        ])
      ]);
      tbody.appendChild(el('tr', {}, [
        el('td', {}, [nameCell]),
        el('td', {class:'file-meta'}, [f.folderName || 'Unfiled']),
        el('td', {class:'file-meta'}, [fmtSize(f.size)]),
        el('td', {class:'file-meta'}, [fmtDate(f.createdAt)]),
        el('td', {}, [el('div', {class:'row-actions'}, [
          el('button', {class:'icon-btn', onclick:function(){ state.modal={type:'preview', fileId:f.id}; render(); }}, ['Preview']),
          el('button', {class:'icon-btn', onclick:function(){ downloadFile(f.id, f.name); }}, ['Download']),
          el('button', {class:'icon-btn', onclick:function(){ state.modal={type:'rename', fileId:f.id, value:f.name}; render(); }}, ['Rename']),
          el('button', {class:'icon-btn', onclick:function(){ state.modal={type:'move', fileId:f.id, value:f.folderId||'root'}; render(); }}, ['Move']),
          el('button', {class:'icon-btn', onclick:function(){ state.modal={type:'tags', fileId:f.id, value:f.tags.join(', ')}; render(); }}, ['Tags']),
          el('button', {class:'icon-btn danger', onclick:function(){ deleteFile(f.id); }}, ['Delete'])
        ])])
      ]));
    });
    table.appendChild(tbody);
    panel.appendChild(table);
    return panel;
  }

  function renderPagination(){
    return el('div', {class:'pagination'}, [
      el('button', {class:'btn-ghost btn icon-btn', onclick:function(){ if(state.page>1){ state.page--; runSearch(); } }}, ['\u2190 Prev']),
      el('span', {}, ['Page ' + state.page + ' / ' + state.totalPages]),
      el('button', {class:'btn-ghost btn icon-btn', onclick:function(){ if(state.page<state.totalPages){ state.page++; runSearch(); } }}, ['Next \u2192'])
    ]);
  }

  function renderFilterPanel(){
    var panel = el('div', {class:'filter-panel'});

    // File type facets
    var typeGroup = el('div', {class:'filter-group'});
    typeGroup.appendChild(el('div', {class:'filter-group-title'}, ['File Type']));
    var typeList = el('div', {class:'facet-list'});
    (state.facets.extensions || []).forEach(function(f){
      if(!f.key) return;
      var checked = state.filters.types.indexOf(f.key) !== -1;
      typeList.appendChild(el('div', {class:'facet-row' + (checked?' checked':''), onclick:function(){ toggleTypeFilter(f.key); }}, [
        el('span', {class:'facet-name'}, [el('span',{class:'checkbox-fake'},[checked?'\u2713':'']), '.' + f.key]),
        el('span', {class:'facet-count'}, [String(f.count)])
      ]));
    });
    if(!(state.facets.extensions||[]).length) typeList.appendChild(el('div', {class:'form-hint'}, ['No results to filter yet.']));
    typeGroup.appendChild(typeList);
    panel.appendChild(typeGroup);

    // Folder facets
    var folderGroup = el('div', {class:'filter-group'});
    folderGroup.appendChild(el('div', {class:'filter-group-title'}, ['Folder']));
    var folderList = el('div', {class:'facet-list'});
    (state.facets.folders || []).forEach(function(f){
      var fid = f.folderId || 'root';
      var checked = state.activeFolder === fid;
      folderList.appendChild(el('div', {class:'facet-row' + (checked?' checked':''), onclick:function(){ toggleFolderFacet(fid); }}, [
        el('span', {class:'facet-name'}, [el('span',{class:'checkbox-fake'},[checked?'\u2713':'']), f.key]),
        el('span', {class:'facet-count'}, [String(f.count)])
      ]));
    });
    folderGroup.appendChild(folderList);
    panel.appendChild(folderGroup);

    // Date range
    var dateGroup = el('div', {class:'filter-group'});
    dateGroup.appendChild(el('div', {class:'filter-group-title'}, ['Date Added']));
    var fromI = el('input', {type:'date', value: state.filters.dateFrom});
    var toI = el('input', {type:'date', value: state.filters.dateTo});
    dateGroup.appendChild(el('div', {class:'range-inputs', style:'flex-direction:column;align-items:stretch;gap:6px;'}, [
      el('label', {class:'field-label', style:'margin-bottom:0;'}, ['From']), fromI,
      el('label', {class:'field-label', style:'margin-bottom:0;margin-top:6px;'}, ['To']), toI
    ]));
    dateGroup.appendChild(el('button', {class:'btn btn-ghost btn-sm apply-range-btn', onclick:function(){
      state.filters.dateFrom = fromI.value; state.filters.dateTo = toI.value; state.page=1; runSearch();
    }}, ['Apply']));
    panel.appendChild(dateGroup);

    // Size range (MB)
    var sizeGroup = el('div', {class:'filter-group'});
    sizeGroup.appendChild(el('div', {class:'filter-group-title'}, ['File Size (MB)']));
    var minI = el('input', {type:'number', placeholder:'Min', value: state.filters.sizeMin, min:'0'});
    var maxI = el('input', {type:'number', placeholder:'Max', value: state.filters.sizeMax, min:'0'});
    sizeGroup.appendChild(el('div', {class:'range-inputs'}, [minI, el('span',{},['\u2013']), maxI]));
    sizeGroup.appendChild(el('button', {class:'btn btn-ghost btn-sm apply-range-btn', onclick:function(){
      state.filters.sizeMin = minI.value; state.filters.sizeMax = maxI.value; state.page=1; runSearch();
    }}, ['Apply']));
    panel.appendChild(sizeGroup);

    // Tags
    var tagGroup = el('div', {class:'filter-group'});
    tagGroup.appendChild(el('div', {class:'filter-group-title'}, ['Tags']));
    var tagWrap = el('div', {});
    state.filters.tags.forEach(function(t){
      tagWrap.appendChild(el('span', {class:'tag-pill'}, [t, el('span',{class:'x', onclick:function(){ removeFilter('tag', t); }},['\u2715'])]));
    });
    tagGroup.appendChild(tagWrap);
    var tagI = el('input', {type:'text', placeholder:'Add tag & press Enter', style:'margin-top:8px;'});
    tagI.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && tagI.value.trim()){
        state.filters.tags.push(tagI.value.trim());
        tagI.value = ''; state.page=1; runSearch();
      }
    });
    tagGroup.appendChild(tagI);
    panel.appendChild(tagGroup);

    return panel;
  }

  var activePreviewUrl = null;
  function closeModal(){
    if(activePreviewUrl){ URL.revokeObjectURL(activePreviewUrl); activePreviewUrl = null; }
    state.modal = null;
    render();
  }

  function renderModal(){
    var m = state.modal;
    var overlay = el('div', {class:'modal-overlay', onclick:function(e){ if(e.target===overlay){ closeModal(); } }});
    var body;

    if(m.type === 'preview'){
      var pf = state.files.filter(function(x){ return x.id===m.fileId; })[0];
      var previewInner = el('div', {class:'preview-body'});
      var actions = [
        el('button', {class:'btn btn-ghost', onclick:closeModal}, ['Close']),
        el('button', {class:'btn', onclick:function(){ downloadFile(m.fileId, pf?pf.name:'file'); }}, ['Download'])
      ];
      if(!pf){
        previewInner.appendChild(el('div', {class:'preview-unsupported'}, ['Document not found.']));
      } else {
        var kind = previewKind(pf);
        var fileUrl = cfg.apiBase + '/api/files/' + pf.id + '/download';
        fetch(fileUrl, { headers: cfg.apiToken ? {Authorization:'Bearer '+cfg.apiToken} : {} }).then(function(r){ return r.blob(); }).then(function(blob){
          activePreviewUrl = URL.createObjectURL(blob);
          previewInner.innerHTML = '';
          if(kind === 'image') previewInner.appendChild(el('img', {src: activePreviewUrl, alt: pf.name}));
          else if(kind === 'video') previewInner.appendChild(el('video', {src: activePreviewUrl, controls:'controls'}));
          else if(kind === 'audio') previewInner.appendChild(el('audio', {src: activePreviewUrl, controls:'controls'}));
          else if(kind === 'pdf') previewInner.appendChild(el('iframe', {src: activePreviewUrl}));
          else if(kind === 'text') blob.text().then(function(t){ previewInner.appendChild(el('pre', {}, [t.slice(0,200000)])); });
          else previewInner.appendChild(el('div', {class:'preview-unsupported'}, ['No inline preview for .' + pf.extension + ' \u2014 download to view.']));
        }).catch(function(){ previewInner.innerHTML=''; previewInner.appendChild(el('div',{class:'preview-unsupported'},['Could not load preview.'])); });
        previewInner.appendChild(el('div', {class:'preview-unsupported'}, ['Loading preview\u2026']));
      }
      body = el('div', {class:'modal modal-wide'}, [
        el('div', {class:'eyebrow form-title'}, [pf ? pf.name : 'Preview']),
        previewInner,
        el('div', {class:'modal-actions'}, actions)
      ]);
    } else if(m.type === 'newFolder'){
      var nameI = el('input', {type:'text', placeholder:'Folder name'});
      var err = el('div', {class:'form-err'});
      body = el('div', {class:'modal'}, [
        el('div', {class:'eyebrow form-title'}, ['New folder']),
        nameI, err,
        el('div', {class:'modal-actions'}, [
          el('button', {class:'btn btn-ghost', onclick:function(){ state.modal=null; render(); }}, ['Cancel']),
          el('button', {class:'btn', onclick:async function(){
            if(!nameI.value.trim()){ err.textContent = 'Folder name is required.'; return; }
            try{ await createFolder(nameI.value.trim()); state.modal=null; render(); }
            catch(e){ err.textContent = e.message; }
          }}, ['Create'])
        ])
      ]);
    } else if(m.type === 'rename'){
      var rI = el('input', {type:'text', value:m.value});
      var errR = el('div', {class:'form-err'});
      body = el('div', {class:'modal'}, [
        el('div', {class:'eyebrow form-title'}, ['Rename document']),
        rI, errR,
        el('div', {class:'modal-actions'}, [
          el('button', {class:'btn btn-ghost', onclick:function(){ state.modal=null; render(); }}, ['Cancel']),
          el('button', {class:'btn', onclick:async function(){
            if(!rI.value.trim()){ errR.textContent = 'Name is required.'; return; }
            try{ await renameFile(m.fileId, rI.value.trim()); state.modal=null; render(); }
            catch(e){ errR.textContent = e.message; }
          }}, ['Save'])
        ])
      ]);
    } else if(m.type === 'move'){
      var sel = el('select', {}, [el('option', {value:'root'}, ['Unfiled'])].concat(
        state.folders.map(function(f){ return el('option', {value:f.id}, [f.name]); })
      ));
      sel.value = m.value;
      body = el('div', {class:'modal'}, [
        el('div', {class:'eyebrow form-title'}, ['Move document']),
        el('label', {class:'field-label'}, ['Destination folder']),
        sel,
        el('div', {class:'modal-actions'}, [
          el('button', {class:'btn btn-ghost', onclick:function(){ state.modal=null; render(); }}, ['Cancel']),
          el('button', {class:'btn', onclick:async function(){
            try{ await moveFile(m.fileId, sel.value); state.modal=null; render(); }
            catch(e){ toast(e.message, true); }
          }}, ['Move'])
        ])
      ]);
    } else if(m.type === 'tags'){
      var tagsI = el('input', {type:'text', placeholder:'comma, separated, tags', value: m.value});
      body = el('div', {class:'modal'}, [
        el('div', {class:'eyebrow form-title'}, ['Edit tags']),
        el('label', {class:'field-label'}, ['Tags']),
        tagsI,
        el('div', {class:'form-hint'}, ['Tags are searchable and show up as filters in the sidebar.']),
        el('div', {class:'modal-actions'}, [
          el('button', {class:'btn btn-ghost', onclick:function(){ state.modal=null; render(); }}, ['Cancel']),
          el('button', {class:'btn', onclick:async function(){
            var tags = tagsI.value.split(',').map(function(t){ return t.trim(); }).filter(Boolean);
            try{ await retagFile(m.fileId, tags); state.modal=null; render(); }
            catch(e){ toast(e.message, true); }
          }}, ['Save'])
        ])
      ]);
    }

    overlay.appendChild(body);
    return overlay;
  }

  /* ---------------- Boot ---------------- */
  async function boot(){
    try{
      await Promise.all([loadFolders(), loadStats()]);
      await runSearch();
    }catch(e){
      appEl.innerHTML = '<div class="loading">Could not reach the documents API: ' + escapeHtml(e.message) + '<br><br>Check DOCS_CONFIG.apiBase / apiToken in this page, and that the Worker is deployed.</div>';
    }
  }

  boot();
})();
</script>
</body>
</html>
